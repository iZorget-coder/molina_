name: Daily Market Pipeline

on:
  schedule:
    - cron: '17 1 * * *'   # 03:17 SAST (main run)
    - cron: '47 2 * * *'   # 04:47 SAST (retry)
    - cron: '17 4 * * *'   # 06:17 SAST (retry)
    - cron: '47 5 * * *'   # 07:47 SAST (last retry)
  workflow_dispatch:

# Never run two pipelines at once (e.g. a scheduled run plus a manual one)
concurrency:
  group: daily-market-pipeline
  cancel-in-progress: false

jobs:
  check-already-ran:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Has the pipeline already succeeded today (SAST)?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Manual runs always go ahead
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Midnight today in SAST, expressed in UTC
          since=$(TZ=Africa/Johannesburg date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)

          done_today=$(gh run list \
            --workflow "Daily Market Pipeline" \
            --status success \
            --limit 50 \
            --json createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\")] | length")

          echo "Successful runs since $since: $done_today"
          if [ "$done_today" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: check-already-ran
    if: needs.check-already-ran.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Extraction
        run: python "Intraday extract.py"

      - name: Update Daily CSVs (Yahoo + Hourly fallback)
        run: python update_daily_csvs.py

      - name: Run Market Data Pipeline
        run: python "market data.py"

      - name: Verify predictions.json
        run: cat predictions.json

      - name: Push to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python push_to_firestore.py
 
      - name: Commit updated CSVs and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.csv predictions.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update market data $(date -u +%Y-%m-%d)"

          # The run takes several minutes, so someone may have pushed in the meantime.
          # Rebase our commit on top of whatever is on main now, then push; retry if main moved again.
          # In a rebase, "theirs" is the commit being replayed (this bot commit), so generated data wins any conflict.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Could not push after 5 attempts"
          exit 1

      - name: Delete daily chats
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python delete_chats.py

          
