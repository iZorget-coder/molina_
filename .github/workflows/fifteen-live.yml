name: Fifteen-Minute Live Candles

# Triggered every 15 minutes by cron-job.org (same way as the hourly pipeline).
# Only fetches the latest 15-minute candles and writes them to Firestore (live_fifteen/latest).
# No training, no CSV changes, nothing committed to git.
on:
  workflow_dispatch:

# If a run is still going when the next 15-minute trigger arrives, the newer run wins.
concurrency:
  group: fifteen-live-candles
  cancel-in-progress: true

jobs:
  live-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tvkit yfinance firebase-admin

      - name: Fetch 15-minute candles and publish to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python live_fifteen.py