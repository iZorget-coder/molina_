name: Hourly Live Candles

# Triggered every hour by cron-job.org (same way as the daily pipeline).
# Only fetches the latest hourly candles and writes them to Firestore (live_hourly/latest).
# No training, no CSV changes, nothing committed to git.
on:
  workflow_dispatch:

# If a run is still going when the next hour's trigger arrives, the newer run wins.
concurrency:
  group: hourly-live-candles
  cancel-in-progress: true

jobs:
  live-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tvkit yfinance firebase-admin

      - name: Fetch hourly candles and publish to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python live_hourly.py